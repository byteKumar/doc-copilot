name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doc_copilot_test
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tests (FakeLLM + FakeEmbedder, real Postgres)
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  eval-subset:
    # Paid: runs 20 eval questions against Claude. Skipped (green) unless the repo has the
    # ANTHROPIC_API_KEY and SEC_USER_AGENT secrets and evals/questions.jsonl exists.
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: doc_copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/doc_copilot
      EMBEDDER: local
    steps:
      - name: Check secrets and eval set
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UA: ${{ secrets.SEC_USER_AGENT }}
        run: |
          if [ -n "$KEY" ] && [ -n "$UA" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No ANTHROPIC_API_KEY/SEC_USER_AGENT secret: skipping paid eval subset."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - name: Eval set present?
        id: evalset
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -f evals/questions.jsonl ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "evals/questions.jsonl not committed yet: skipping."; fi
      - uses: astral-sh/setup-uv@v6
        if: steps.evalset.outputs.run == 'true'
        with:
          version: "0.13.7"
      - if: steps.evalset.outputs.run == 'true'
        run: uv python install 3.12 && uv sync --frozen --extra local-embeddings
      - name: Cache filings
        if: steps.evalset.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: data/filings
          key: filings-${{ hashFiles('corpus.toml') }}
      - name: Download and ingest corpus
        if: steps.evalset.outputs.run == 'true'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          uv run doc-copilot download --corpus corpus.toml --out data/filings
          uv run doc-copilot ingest --dir data/filings
      - name: Eval subset (20 questions)
        if: steps.evalset.outputs.run == 'true'
        env:
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run doc-copilot eval run --subset 20 --dry-run
          uv run doc-copilot eval run --subset 20 --yes
      - uses: actions/upload-artifact@v4
        if: steps.evalset.outputs.run == 'true'
        with:
          name: eval-subset
          path: evals/runs/
