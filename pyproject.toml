[project]
name = "doc-copilot"
version = "0.1.0"
description = "Grounded question answering over SEC 10-K filings, with citations, refusals and an eval harness."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.5",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Real local embeddings (pulls in torch). Tests and CI use FakeEmbedder and do not need it.
local-embeddings = ["sentence-transformers>=3.0"]

[project.scripts]
doc-copilot = "doc_copilot.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a real Postgres with pgvector (docker compose up -d db)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
